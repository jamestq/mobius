[project]
name = "bagent"
version = "0.1.0"
description = "This builds agentic coding pipelines"
authors = [
    {name = "timothy.qng@pm.me"}
]
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.24.1,<0.25.0)",
    "pyyaml (>=6.0,<7.0)",
    "jsonschema (>=4.0,<5.0)"
]

[project.scripts]
bagent = "bagent.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
