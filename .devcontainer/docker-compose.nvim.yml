services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: devcontainer-base:latest
    env_file: .env
    volumes:
      - ..:/workspace
      - dev-config:/home/dev
      - claude-config:/home/dev/.claude
      - poetry-cache:/home/dev/.cache/pypoetry
      - pip-cache:/home/dev/.cache/pip
      - npm-cache:/home/dev/.npm
      - bash-history:/commandhistory
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    user: dev
    stdin_open: true
    tty: true
    environment:
      POWERLEVEL9K_DISABLE_GITSTATUS: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      BASH_ENV: /workspace/.claude/project-env.sh
    ports:
      - "8000:8000"
      - "8001:8001"
      - "3000:3000"
      - "3001:3001"

volumes:
  dev-config:
  claude-config:
    external: true
    name: claude-config
  bash-history:
    external: true
    name: bash-history
  poetry-cache:
    external: true
    name: poetry-cache
  pip-cache:
    external: true
    name: pip-cache
  npm-cache:
    external: true
    name: npm-cache
